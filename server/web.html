<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenEnv - Autonomous Agent Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050810;
            --surface: rgba(10, 15, 30, 0.8);
            --border: rgba(100, 150, 255, 0.2);
            --accent: #00f0ff;
            --accent-dim: rgba(0, 240, 255, 0.15);
            --success: #00ff88;
            --warning: #ffb86c;
            --error: #ff4757;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0,240,255,0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0,255,136,0.05) 0%, transparent 40%);
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            background: rgba(5, 8, 16, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo h1 {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .logo span { color: var(--accent); }

        .controls { display: flex; gap: 1rem; }

        button {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            font-family: 'Outfit';
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }
        button:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        
        button.danger {
            background: rgba(255, 71, 87, 0.1); color: var(--error); border-color: var(--error);
        }
        button.danger:hover { background: var(--error); color: #fff; box-shadow: 0 0 15px var(--error); }

        .main-container {
            flex: 1;
            display: flex;
            padding: 1.5rem;
            gap: 1.5rem;
            overflow: hidden;
        }

        .stats-panel {
            width: 300px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .stat-box {
            text-align: center;
            padding: 1rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .stat-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
        }

        .stat-value {
            font-size: 2.5rem;
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .terminal-panel {
            flex: 1;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .terminal-header {
            background: #111;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #333;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        .terminal-body {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .log-line {
            padding: 0.2rem 0;
            animation: fadeIn 0.3s ease-out;
            word-break: break-all;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-sys      { color: var(--text-muted); }
        .log-start    { color: var(--accent); font-weight: bold; border-left: 2px solid var(--accent); padding-left: 0.5rem;}
        .log-step     { color: var(--text-main); }
        .log-step-num { color: #a5d6ff; }
        .log-method   { color: var(--warning); }
        .log-reward   { color: var(--success); }
        .log-end      { color: var(--success); font-weight: bold; border-left: 2px solid var(--success); padding-left: 0.5rem; margin-top:1rem;}
        .log-err      { color: var(--error); }
        .log-debug    { color: #ff7b72; font-style: italic; }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            box-shadow: 0 0 8px var(--text-muted);
            margin-right: 8px;
        }
        .status-dot.active {
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>Auto<span>Agent</span> Stream</h1>
        </div>
        <div class="controls">
            <button id="btn-start" onclick="startStream()">Initiate Sequence</button>
            <button id="btn-stop" class="danger" onclick="stopStream()" disabled>Abort</button>
        </div>
    </header>

    <div class="main-container">
        
        <div class="stats-panel">
            <h3 style="font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px;">Live Telemetry</h3>
            
            <div class="stat-box">
                <div class="stat-value" id="ui-step">0</div>
                <div class="stat-label">Current Step</div>
            </div>

            <div class="stat-box">
                <div class="stat-value" id="ui-reward" style="color: var(--success)">0.00</div>
                <div class="stat-label">Total Reward</div>
            </div>

            <div class="stat-box" style="margin-top:auto;">
                <div class="stat-label" style="margin:0; font-size:0.8rem; color:#fff;" id="ui-status">
                    <span class="status-dot"></span> System Offline
                </div>
            </div>
        </div>

        <div class="terminal-panel">
            <div class="terminal-header">
                <span>user@matrix:~/api_security_rl$ ./inference.py</span>
                <span id="conn-status" style="color: #666">Disconnected</span>
            </div>
            <div class="terminal-body" id="term-out">
                <div class="log-line log-sys">Waiting for execution command...</div>
            </div>
        </div>

    </div>

    <script>
        let ws = null;
        let totalReward = 0.0;

        function setStatus(active, text) {
            const el = document.getElementById('ui-status');
            const dot = el.querySelector('.status-dot');
            if(active) {
                dot.classList.add('active');
                el.innerHTML = `<span class="status-dot active"></span> ${text}`;
                document.getElementById('conn-status').textContent = 'CONNECTED';
                document.getElementById('conn-status').style.color = 'var(--accent)';
            } else {
                dot.classList.remove('active');
                el.innerHTML = `<span class="status-dot"></span> ${text}`;
                document.getElementById('conn-status').textContent = 'DISCONNECTED';
                document.getElementById('conn-status').style.color = '#666';
            }
        }

        function appendLog(line) {
            const term = document.getElementById('term-out');
            const div = document.createElement('div');
            div.className = 'log-line';

            if (line.startsWith('[START]')) {
                div.classList.add('log-start');
                div.textContent = line;
                totalReward = 0.0;
                document.getElementById('ui-step').textContent = '0';
                document.getElementById('ui-reward').textContent = '0.00';
            } 
            else if (line.startsWith('[STEP]')) {
                div.classList.add('log-step');
                
                // Parse step=X action=METHOD path reward=Y
                const stepMatch = line.match(/step=(\d+)/);
                if(stepMatch) document.getElementById('ui-step').textContent = stepMatch[1];
                
                const rewardMatch = line.match(/reward=([\-\d\.]+)/);
                if(rewardMatch) {
                    totalReward += parseFloat(rewardMatch[1]);
                    document.getElementById('ui-reward').textContent = totalReward.toFixed(3);
                }

                // Format it nicely
                let formattedLine = line
                    .replace(/step=(\d+)/, 'step=<span class="log-step-num">$1</span>')
                    .replace(/action=([A-Z]+ .*?) /, 'action=<span class="log-method">$1</span> ')
                    .replace(/reward=([\-\d\.]+)/, 'reward=<span class="log-reward">$1</span>');
                
                div.innerHTML = formattedLine;
            }
            else if (line.startsWith('[END]')) {
                div.classList.add('log-end');
                div.textContent = line;
            }
            else if (line.startsWith('[DEBUG]')) {
                div.classList.add('log-debug');
                div.textContent = line;
            }
            else if (line === '[PROCESS COMPLETED]') {
                div.classList.add('log-sys');
                div.textContent = "Process exited cleanly.";
            }
            else {
                div.classList.add('log-sys');
                div.textContent = line;
            }

            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        function startStream() {
            if (ws && ws.readyState !== WebSocket.CLOSED) {
                return;
            }

            document.getElementById('term-out').innerHTML = '';
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            setStatus(true, "Agent Initializing...");
            appendLog(">>> Establishing WebSocket connection to /ws/inference ...");

            // protocol logic
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${window.location.host}/inference-stream`);

            ws.onopen = () => {
                appendLog(">>> Connection established. Executing inference.py...");
                setStatus(true, "Agent Running...");
            };

            ws.onmessage = (event) => {
                if (event.data === "[PROCESS COMPLETED]") {
                    appendLog(event.data);
                    ws.close();
                } else {
                    appendLog(event.data);
                }
            };

            ws.onclose = () => {
                appendLog(">>> Connection closed.");
                document.getElementById('btn-start').disabled = false;
                document.getElementById('btn-stop').disabled = true;
                setStatus(false, "System Offline");
                ws = null;
            };

            ws.onerror = (err) => {
                appendLog(">>> WebSocket Error observed.");
            };
        }

        function stopStream() {
            if (ws) {
                appendLog(">>> Abort signal sent. Terminating...");
                ws.close();
            }
        }
    </script>
</body>
</html>
